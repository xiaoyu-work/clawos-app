<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clipboard</title><link rel="stylesheet" href="shared/ui.css"></head><body>
<header><div><h1>Clipboard</h1><p data-app-label>System selection and declared clipboard operations</p></div></header>
<main class="stack"><div class="toolbar"><select id="selection" style="width:180px"><option value="clipboard">Clipboard</option>
<option value="primary">Primary selection</option></select><input id="mime" value="text/plain;charset=utf-8" aria-label="MIME type">
<button id="read" class="primary">Read selection</button><button id="status">Status</button></div>
<p id="notice" class="notice"></p><section class="card"><h2>Selection content</h2><pre id="content" style="margin-top:12px"></pre></section>
<section class="card"><h2>Write and history controls</h2><p>Writing uses an authorized source file. Clipboard and history permissions remain separate.</p>
<div id="actions" class="toolbar" style="margin-top:12px"></div><div id="result"></div></section><div id="more"></div></main>
<script src="shared/client.js"></script><script src="shared/ui.js"></script><script src="app.js"></script></body></html>
