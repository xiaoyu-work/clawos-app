<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Launcher</title><link rel="stylesheet" href="shared/ui.css"></head><body>
<header><div><h1>Launcher</h1><p data-app-label>Desktop application discovery and controlled OS launch</p></div></header>
<main class="stack"><form id="search"><div class="toolbar"><input id="query" placeholder="Find a desktop application">
