<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mail</title><link rel="stylesheet" href="shared/ui.css"></head><body>
<header><div><h1>Mail</h1><p data-app-label>Mailboxes, drafts and account-scoped delivery</p></div></header>
<main class="stack"><div class="toolbar" id="mail-toolbar"><select id="accounts" aria-label="Mail account" style="width:220px"></select>
<select id="folders" aria-label="Mailbox folder" style="width:180px"></select>
<input id="query" placeholder="Search messages"><button id="search">Search</button><button id="refresh">Refresh</button>
<button id="compose" class="primary">Compose</button></div><p id="notice" class="notice" role="status"></p>
<div class="split" id="mailbox"><section class="card stack"><div class="toolbar">
<label class="row"><input id="unread" type="checkbox">Unread only</label>
<label>Messages per page<select id="limit"><option>25</option><option>50</option><option>100</option></select></label></div>
<p id="message-count" class="small muted"></p><div id="messages" class="list"></div></section>
<section class="card stack"><h2 id="subject">Message</h2><p id="sender" class="muted small"></p>
<div id="message" class="prose muted">Select a message to read it.</div><div id="attachments" class="stack"></div>
<div id="message-actions" class="toolbar"></div></section></div>
<section id="draft" class="card stack" hidden><h2>Saved draft</h2><div id="draft-content" class="stack"></div>
<div id="draft-actions" class="toolbar"></div></section>
<section class="card stack" id="ai"><h2>Mail AI</h2><p class="muted small">Explicit text assistance uses this App's own AI consent and budget.</p>
<label>Message or writing context<textarea id="ai-input" rows="6" placeholder="Paste the message or describe what you want to write."></textarea></label>
<div id="ai-actions" class="toolbar"></div><div id="ai-result"></div></section><div id="more"></div></main>
<script src="shared/client.js"></script><script src="shared/ui.js"></script><script src="app.js"></script></body></html>
