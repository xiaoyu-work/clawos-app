[package]
name = "cosmic-settings-a11y-manager-subscription"
version = "1.0.7"
edition = "2024"
license = "MPL-2.0"
rust-version.workspace = true
publish = true

[dependencies]
cosmic-settings-provider-client = { path = "../../crates/provider-client" }
