<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claw Agent</title>
  <style>
    :root {
      color-scheme: light dark;
      font: 14px/1.5 system-ui, sans-serif;
      --surface: #f7f7f5;
      --card: #fff;
      --ink: #212320;
      --muted: #595e55;
      --line: #dadbd5;
      --accent: #216249;
      --accent-ink: #fff;
      --bubble: #e7ebe3;
      --warning: #8a430c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --surface: #232521;
        --card: #2b2e28;
        --ink: #edf0e9;
        --muted: #b9c1b4;
        --line: #494e44;
        --accent: #b0ddc3;
        --accent-ink: #1e3428;
        --bubble: #373f35;
        --warning: #ffd0a4;
      }
    }
    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      height: 100dvh;
      margin: 0;
      background: var(--surface);
      color: var(--ink);
    }
    header, footer { padding: 14px 16px; }
    header {
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--line);
    }
    .mark {
      display: grid;
      place-items: center;
      flex: none;
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: var(--accent);
      color: var(--accent-ink);
      font-weight: 750;
    }
    header h1, main h2, p { margin: 0; }
    header h1 { font-size: 15px; }
    header div { flex: 1; min-width: 0; }
    header small, .empty p, .hint { color: var(--muted); }
    main { min-width: 0; overflow-y: auto; padding: 18px 16px; }
    .empty { margin: min(13vh, 90px) 0 0; }
    h2 { font-size: 22px; line-height: 1.22; }
    .empty p { margin-top: 7px; }
    .example { margin-top: 16px; }
    #messages { display: flex; flex-direction: column; gap: 16px; }
    .message { min-width: 0; padding: 8px 0; overflow-wrap: anywhere; white-space: pre-wrap; }
    .message.user {
      align-self: flex-end;
      max-width: 88%;
      border-radius: 15px 15px 4px 15px;
      padding: 9px 12px;
      background: var(--bubble);
    }
    .message.assistant::before {
      content: "Claw Agent";
      display: block;
      margin-bottom: 4px;
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .04em;
    }
    footer { border-top: 1px solid var(--line); }
    .status { margin: 0 0 8px; color: var(--muted); overflow-wrap: anywhere; }
    .status[data-tone="error"] { color: var(--warning); }
    .context { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-bottom: 8px; }
    .context label { display: flex; gap: 6px; align-items: center; }
    input { margin: 0; accent-color: var(--accent); }
    #site { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    form {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 7px;
      align-items: end;
      padding: 8px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: var(--card);
    }
    form:focus-within { border-color: var(--accent); }
    textarea {
      min-width: 0;
      max-height: 12em;
      width: 100%;
      resize: vertical;
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      padding: 5px;
    }
    button {
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 5px 9px;
      background: var(--card);
      color: inherit;
      font: inherit;
      cursor: pointer;
    }
    button:not(:disabled):hover { border-color: var(--accent); }
    button:disabled { opacity: .52; cursor: default; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    textarea:focus-visible { outline-offset: -2px; }
    #send { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
    .actions { display: flex; gap: 7px; }
    .secondary { display: flex; gap: 8px; align-items: center; justify-content: space-between; margin-top: 8px; }
    #access { border: 0; padding: 0; color: var(--muted); background: none; text-decoration: underline; }
  </style>
</head>
<body>
  <header>
    <span class="mark" aria-hidden="true">C</span>
    <div><h1>Claw Agent</h1><small>In this browser</small></div>
    <button id="new-chat" type="button" disabled>New chat</button>
  </header>
  <main id="transcript" aria-label="Conversation">
    <section id="empty" class="empty">
      <h2>What can I help with?</h2>
      <p>Chat with Claw Agent, or choose your current tab and ask it to read or act on the page.</p>
      <button id="summarize" class="example" type="button" disabled>Summarize this page</button>
    </section>
    <div id="messages" role="log" aria-label="Chat messages" aria-live="off"></div>
  </main>
  <footer>
    <p id="status" class="status" role="status" hidden></p>
    <div class="context">
      <label><input id="include-tab" type="checkbox" disabled> Use current tab</label>
      <span id="site"></span>
    </div>
    <form id="composer">
      <textarea id="prompt" rows="2" maxlength="32768" aria-label="Message Claw Agent" placeholder="Message Claw Agent"></textarea>
      <div class="actions">
        <button id="send" type="submit" disabled>Send</button>
        <button id="reconnect" type="button" hidden>Reconnect</button>
        <button id="stop" type="button" hidden>Stop</button>
      </div>
    </form>
    <div class="secondary">
      <small class="hint">Tab actions use Claw OS permissions.</small>
      <button id="access" type="button" disabled>Pause tab access</button>
    </div>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
