<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Text Editor</title><link rel="stylesheet" href="shared/ui.css"></head><body>
<header><div><h1>Text Editor</h1><p data-app-label>Read, edit and save through the App's controlled filesystem</p></div></header>
<main class="stack"><div class="toolbar"><input id="path" placeholder="Authorized file path"><button id="open">Open</button>
<button id="save" class="primary">Save</button><span id="state" class="pill">No file loaded</span></div>
<p id="notice" class="notice"></p><textarea id="editor" class="editor" spellcheck="false" aria-label="File content"></textarea>
<section class="card stack"><h2>Editing tools</h2><div id="actions" class="toolbar"></div><div id="result"></div></section>
<div id="more"></div></main><script src="shared/client.js"></script><script src="shared/ui.js"></script><script src="app.js"></script></body></html>
