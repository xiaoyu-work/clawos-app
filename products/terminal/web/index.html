<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Terminal</title><link rel="stylesheet" href="shared/ui.css"></head><body>
<header><div><h1>Terminal</h1><p data-app-label>Authorized commands and process control</p></div></header>
<main class="stack"><form id="command"><div class="toolbar"><input name="command" placeholder="Executable" required>
<input name="arguments" placeholder='Arguments as JSON, e.g. ["--version"]'><button class="primary" type="submit">Run</button></div></form>
<p class="muted small">This is a structured command runner, not an interactive PTY or an unrestricted host shell.</p>
<p id="notice" class="notice"></p><section class="card"><pre id="output" aria-live="polite"></pre></section>
<section class="card stack"><h2>Scripts and background processes</h2><div id="actions" class="toolbar"></div><div id="processes"></div></section>
<div id="more"></div></main><script src="shared/client.js"></script><script src="shared/ui.js"></script><script src="app.js"></script></body></html>
