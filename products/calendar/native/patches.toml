[patch."https://github.com/smithay/client-toolkit.git"]
sctk = { package = "smithay-client-toolkit", version = "0.20.0" }

[patch."https://github.com/pop-os/cosmic-protocols"]
cosmic-protocols = { git = "https://github.com/pop-os/cosmic-protocols//", branch = "main" }
cosmic-client-toolkit = { git = "https://github.com/pop-os/cosmic-protocols//", branch = "main" }

# [patch.'https://github.com/pop-os/dbus-settings-bindings']
# cosmic-dbus-networkmanager = { path = "../dbus-settings-bindings/networkmanager" }
# upower_dbus = { path = "../dbus-settings-bindings/upower" }
# nm-secret-agent-manager = { path = "../dbus-settings-bindings/nm-secret-agent-manager" }

# Build the panel applets against the vendored toolkit rather than upstream
# libcosmic. Applet popup shells, tooltips and menus are styled inside
# `desktop/toolkit`; without this patch the dock and top bar would keep
# resolving the pinned upstream crate and render stock COSMIC grey.
[patch.'https://github.com/pop-os/libcosmic']
cosmic-config = { path = "../toolkit/cosmic-config" }
cosmic-config-derive = { path = "../toolkit/cosmic-config-derive" }
cosmic-theme = { path = "../toolkit/cosmic-theme" }
iced = { path = "../toolkit/iced" }
iced_accessibility = { path = "../toolkit/iced/accessibility" }
iced_core = { path = "../toolkit/iced/core" }
iced_debug = { path = "../toolkit/iced/debug" }
iced_futures = { path = "../toolkit/iced/futures" }
iced_graphics = { path = "../toolkit/iced/graphics" }
iced_program = { path = "../toolkit/iced/program" }
iced_renderer = { path = "../toolkit/iced/renderer" }
iced_runtime = { path = "../toolkit/iced/runtime" }
iced_tiny_skia = { path = "../toolkit/iced/tiny_skia" }
iced_wgpu = { path = "../toolkit/iced/wgpu" }
iced_widget = { path = "../toolkit/iced/widget" }
iced_winit = { path = "../toolkit/iced/winit" }
libcosmic = { path = "../toolkit" }
