<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calendar</title><link rel="stylesheet" href="shared/ui.css"></head><body>
<header><div><h1>Calendar</h1><p data-app-label>Events, invitations and connected calendars</p></div></header>
<main class="stack"><div class="toolbar"><button id="previous">Previous</button><h2 id="month"></h2>
<button id="next">Next</button><button id="today">Today</button><select id="provider" aria-label="Calendar" style="width:auto"><option value="local">Local calendar</option>
<option value="google">Google</option><option value="outlook">Outlook</option></select>
<button id="refresh">Refresh</button><button id="create" class="primary">New event</button></div>
<p id="notice" class="notice" role="status"></p><div id="weekdays" class="weekdays"></div><div id="calendar" class="calendar"></div>
<div class="split"><section class="card stack"><h2 id="day-title">Agenda</h2><div id="agenda" class="stack"></div></section>
<section class="card stack"><h2>Event details</h2><div id="details" class="small muted">Select an event to inspect it.</div></section></div>
<div id="more"></div></main><script src="shared/client.js"></script><script src="shared/ui.js"></script><script src="app.js"></script>
</body></html>
