name: Application contracts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CLAW_CI_APT_SOURCES: /etc/apt/sources.list.d/ubuntu.sources

jobs:
  products:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        product: [mail, calendar, files, browser, terminal, containers, backup-recovery, store, diagnostics, storage, settings, security, maintenance, events-audit, launcher, clipboard, messaging-channels, notification-delivery, home-integration, desktop-widgets, editor, capture, media-player, notifications]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python3 -m pip install -r requirements-dev.txt
      - name: Install Files search dependency
        if: matrix.product == 'files'
        run: |
          test -s "$CLAW_CI_APT_SOURCES"
          sudo apt-get -o Dir::Etc::sourcelist="$CLAW_CI_APT_SOURCES" \
            -o Dir::Etc::sourceparts=- update -qq
          sudo apt-get install -y ripgrep
      - name: Enable isolated Notify process fixture
        if: matrix.product == 'notifications'
        run: |
          test -s "$CLAW_CI_APT_SOURCES"
          sudo apt-get -o Dir::Etc::sourcelist="$CLAW_CI_APT_SOURCES" \
            -o Dir::Etc::sourceparts=- update -qq
          sudo apt-get install -y bubblewrap
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: python3 tools/test.py ${{ matrix.product }}

  capabilities:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        capability: [document-engine, storage-sdk, http]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install -r requirements-dev.txt
      - name: Install declared document parser dependencies
        if: matrix.capability == 'document-engine'
        run: python3 -m pip install pymupdf python-docx openpyxl python-pptx
      - run: python3 tools/test.py --capability ${{ matrix.capability }}

  native:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        product: [calendar, clipboard, desktop-widgets, launcher, editor, files, terminal, store, settings, capture, media-player, notifications]
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native toolkit build dependencies
        run: |
          test -s "$CLAW_CI_APT_SOURCES"
          sudo apt-get -o Dir::Etc::sourcelist="$CLAW_CI_APT_SOURCES" \
            -o Dir::Etc::sourceparts=- update -qq
          sudo apt-get install -y pkg-config cmake libfontconfig-dev libfreetype-dev \
            libwayland-dev libxkbcommon-dev libudev-dev libinput-dev libdbus-1-dev \
            libsystemd-dev libegl1-mesa-dev libgbm-dev
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Install Editor file chooser dependencies
        if: matrix.product == 'editor' || matrix.product == 'files' || matrix.product == 'terminal'
        run: sudo apt-get install -y libglib2.0-dev
      - name: Install Store native backend dependencies
        if: matrix.product == 'store'
        run: sudo apt-get install -y libflatpak-dev
      - name: Install Media Player native backend dependencies
        if: matrix.product == 'media-player'
        run: sudo apt-get install -y libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libglib2.0-dev
      - name: Install Settings native backend dependencies
        if: matrix.product == 'settings'
        run: sudo apt-get install -y libpipewire-0.3-dev libpulse-dev libxkbregistry-dev libclang-dev gettext libglib2.0-dev
      - run: python3 tools/native_build.py ${{ matrix.product }} test
      - name: Build and exercise native Notifications executable
        if: matrix.product == 'notifications'
        run: |
          sudo apt-get install -y bubblewrap dbus-daemon
          cargo install just --locked
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          python3 tools/native_build.py notifications build
          cargo check --locked --manifest-path build/notifications-native/Cargo.toml \
            --target-dir build/native-target -p cosmic-notifications --no-default-features
          python3 products/notifications/native/test_process.py
      - name: Build and exercise native Media Player executable
        if: matrix.product == 'media-player'
        run: |
          sudo apt-get install -y bubblewrap dbus-daemon
          cargo install just --locked
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          python3 tools/native_build.py media-player build
          python3 products/media-player/native/test_process.py
      - name: Build and exercise native Capture executable
        if: matrix.product == 'capture'
        run: |
          sudo apt-get install -y dbus-daemon
          cargo install just --locked
          python3 tools/native_build.py capture build
          python3 products/capture/native/test_process.py
      - name: Build and exercise native Settings executable
        if: matrix.product == 'settings'
        run: |
          sudo apt-get install -y bubblewrap
          cargo install just --locked
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          python3 tools/native_build.py settings build
          python3 products/settings/native/test_process.py
      - name: Build and exercise native Store executable
        if: matrix.product == 'store'
        run: |
          sudo apt-get install -y bubblewrap
          cargo install just --locked
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          python3 tools/native_build.py store build
          python3 products/store/native/test_process.py
      - name: Build and exercise native Launcher executable
        if: matrix.product == 'launcher'
        run: |
          sudo apt-get install -y bubblewrap
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          python3 tools/native_build.py launcher build
          python3 products/launcher/native/test_process.py
      - name: Build and exercise native Editor executable
        if: matrix.product == 'editor'
        run: |
          python3 tools/native_build.py editor build
          python3 products/editor/native/test_process.py
      - name: Build and exercise native Files executables
        if: matrix.product == 'files'
        run: |
          sudo apt-get install -y bubblewrap
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          python3 tools/native_build.py files build
          python3 products/files/native/test_process.py
      - name: Build and exercise native Terminal executable
        if: matrix.product == 'terminal'
        run: |
          sudo apt-get install -y bubblewrap
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          python3 tools/native_build.py terminal build
          python3 products/terminal/native/test_process.py
