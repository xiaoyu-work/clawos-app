name: Application contracts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  products:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        product: [mail, calendar, files, browser, terminal, containers, backup-recovery, store, diagnostics, storage, settings, security, maintenance, events-audit, launcher, clipboard, messaging-channels, notification-delivery, home-integration, desktop-widgets]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python3 -m pip install -r requirements-dev.txt
      - name: Install Files search dependency
        if: matrix.product == 'files'
        run: sudo apt-get update -qq && sudo apt-get install -y ripgrep
      - run: python3 tools/test.py ${{ matrix.product }}

  native:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        product: [calendar, clipboard, desktop-widgets]
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native toolkit build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pkg-config cmake libfontconfig-dev libfreetype-dev \
            libwayland-dev libxkbcommon-dev libudev-dev libinput-dev libdbus-1-dev \
            libsystemd-dev libegl1-mesa-dev libgbm-dev
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: python3 tools/native_build.py ${{ matrix.product }} test
