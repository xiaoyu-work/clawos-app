name: Release selected applications

on:
  workflow_dispatch:
    inputs:
      select:
        description: "Comma-separated products, capability:<name>, support, sets; or all"
        required: true
        type: string
      version:
        description: "MAJOR.MINOR.PATCH[~rcN][-REVISION]; independently versioned selection"
        required: true
        type: string
      initialize:
        description: "First publication only; refuses an existing or lost APT channel"
        default: false
        type: boolean
      fixtures:
        description: "Also publish optional complete source/staging fixture archives"
        default: false
        type: boolean
      provenance_cli_url:
        description: "Owner-approved published provenance-capable cos executable URL"
        required: true
        type: string
      provenance_cli_sha256:
        description: "Exact SHA256 of that public signing tool"
        required: true
        type: string
      publisher_key_id:
        description: "Trusted App package Ed25519 publisher key ID (sha256:...)"
        required: true
        type: string
  workflow_call:
    inputs:
      select:
        required: true
        type: string
      version:
        required: true
        type: string
      initialize:
        default: false
        type: boolean
      fixtures:
        default: false
        type: boolean
      provenance_cli_url:
        required: true
        type: string
      provenance_cli_sha256:
        required: true
        type: string
      publisher_key_id:
        required: true
        type: string
    secrets:
      CLAW_APPS_APT_SIGNING_PRIVATE_KEY:
        required: true
      CLAW_APPS_APT_SIGNING_PASSPHRASE:
        required: true
      CLAW_APPS_PROVENANCE_SIGNING_PRIVATE_KEY:
        required: true

permissions:
  contents: read

concurrency:
  group: app-apt-publication
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - id: plan
        env:
          SELECTION: ${{ inputs.select }}
          RELEASE_VERSION: ${{ inputs.version }}
          INCLUDE_FIXTURES: ${{ inputs.fixtures }}
        run: |
          args=()
          if [ "$INCLUDE_FIXTURES" = true ]; then args+=(--fixtures); fi
          matrix=$(python3 tools/release.py plan --select "$SELECTION" --version "$RELEASE_VERSION" "${args[@]}")
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-plan
          path: build/release-plan.json
          if-no-files-found: error

  contracts:
    needs: plan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: app-release-plan
          path: build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python3 tools/release_ci.py test --plan build/release-plan.json
      - name: Test selected App contracts and isolated release transactions
        run: |
          export TMPDIR="$PWD/build/ci-work"
          python3 tools/release.py test --plan build/release-plan.json --architecture all
          python3 -m pytest -q tests/release --basetemp=build/release-tests

  build:
    needs: [plan, contracts]
    runs-on: ${{ matrix.runner }}
    container: debian:trixie
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - name: Bootstrap the declared Debian build container
        run: apt-get update -qq && apt-get install --no-install-recommends -y git ca-certificates python3
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: app-release-plan
          path: build
      - env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: python3 tools/release_ci.py build --plan build/release-plan.json --architecture "$ARCHITECTURE"
      - if: matrix.architecture != 'all'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: Test the selected native products
        if: matrix.architecture != 'all'
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          export TMPDIR="$PWD/build/ci-work"
          python3 tools/release.py test --plan build/release-plan.json --architecture "$ARCHITECTURE"
      - name: Build real installable App payloads
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          export TMPDIR="$PWD/build/ci-work"
          python3 tools/release.py build --plan build/release-plan.json --architecture "$ARCHITECTURE"
      - uses: actions/upload-artifact@v4
        with:
          name: app-debs-${{ matrix.architecture }}
          path: |
            build/release/*.deb
            build/release/claw-app-development-*.tar.xz
            build/release/claw-app-interfaces-*.tar.gz
            build/release/build-record-*.json
          if-no-files-found: error

  publish:
    needs: [plan, contracts, build]
    runs-on: ubuntu-24.04
    environment: app-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: app-release-plan
          path: build
      - uses: actions/download-artifact@v4
        with:
          pattern: app-debs-*
          path: build/release
          merge-multiple: true
      - name: Configure authenticated Git transport
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh auth setup-git --hostname github.com
      - name: Publish immutable assets and verify the retained App APT snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          CLAW_APPS_APT_SIGNING_PRIVATE_KEY: ${{ secrets.CLAW_APPS_APT_SIGNING_PRIVATE_KEY }}
          CLAW_APPS_APT_SIGNING_PASSPHRASE: ${{ secrets.CLAW_APPS_APT_SIGNING_PASSPHRASE }}
          INITIALIZE: ${{ inputs.initialize }}
          PROVENANCE_URL: ${{ inputs.provenance_cli_url }}
          PROVENANCE_SHA256: ${{ inputs.provenance_cli_sha256 }}
          PROVENANCE_KEY_ID: ${{ inputs.publisher_key_id }}
          PROVENANCE_PUBLISHER: ${{ vars.CLAW_APPS_PROVENANCE_PUBLISHER_JSON }}
          CLAW_APPS_PROVENANCE_SIGNING_PRIVATE_KEY: ${{ secrets.CLAW_APPS_PROVENANCE_SIGNING_PRIVATE_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          import sys
          from urllib.parse import urlsplit
          sys.path.insert(0, "tools")
          from platform_dependency import _download
          from release_common import digest, run
          from release_publish import require_publication_contract
          from release_common import config
          require_publication_contract(config())
          url = os.environ["PROVENANCE_URL"]
          parsed = urlsplit(url)
          checksum = os.environ["PROVENANCE_SHA256"]
          if parsed.scheme != "https" or parsed.hostname != "github.com" or not parsed.path.startswith(
              "/xiaoyu-work/claw-os/releases/download/"
          ) or not re.fullmatch(r"[0-9a-f]{64}", checksum):
              raise ValueError("A pinned published OS provenance tool is required")
          tool = Path("build/provenance-cos")
          _download(url, tool)
          if digest(tool) != checksum:
              raise ValueError("Public provenance tool SHA256 mismatch")
          tool.chmod(0o755)
          publisher = json.loads(os.environ["PROVENANCE_PUBLISHER"])
          trust = Path("build/provenance-publisher.json")
          trust.write_text(json.dumps(publisher))
          run([tool, "provenance", "trust", "add", "--file", trust])
          key = Path("build/provenance-signing-key.json")
          descriptor = os.open(key, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(descriptor, "w") as output:
              output.write(os.environ.pop("CLAW_APPS_PROVENANCE_SIGNING_PRIVATE_KEY"))
          PY
          trap 'rm -f build/provenance-signing-key.json' EXIT
          args=()
          if [ "$INITIALIZE" = true ]; then args+=(--initialize); fi
          python3 tools/release_publish.py publish --plan build/release-plan.json \
            --artifacts build/release "${args[@]}" \
            --cos build/provenance-cos --cos-sha256 "$PROVENANCE_SHA256" \
            --publisher-key-id "$PROVENANCE_KEY_ID" --app-signing-key build/provenance-signing-key.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/apt-publication

  deploy:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the verified APT snapshot
        id: deployment
        uses: actions/deploy-pages@v4
