<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HTTP Client</title><link rel="stylesheet" href="shared/ui.css"></head><body>
<header><div><h1>HTTP Client</h1><p data-app-label>Capability-scoped HTTP requests and private downloads</p></div></header>
<main class="stack"><form id="request" class="card stack"><div class="toolbar">
<select name="method" style="width:120px"><option>GET</option><option>POST</option><option>PUT</option><option>DELETE</option><option>HEAD</option></select>
<input name="url" placeholder="HTTPS URL" required><button class="primary" type="submit">Send request</button></div>
<label>Request body<textarea name="data"></textarea></label></form><p id="notice" class="notice"></p>
<section class="card stack"><h2>Response</h2><div id="response"></div></section><div id="actions" class="toolbar"></div><div id="more"></div></main>
<script src="shared/client.js"></script><script src="shared/ui.js"></script><script src="app.js"></script></body></html>
