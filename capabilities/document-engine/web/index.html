<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Document Engine</title><link rel="stylesheet" href="shared/ui.css"></head><body>
<header><div><h1>Document Engine</h1><p data-app-label>Shared document client: inspection, conversion and explicit-text AI</p></div></header>
<main class="stack"><section class="card stack"><h2>Document</h2><label>Authorized file path<input id="path"></label>
<div id="file-actions" class="toolbar"></div></section><section class="card stack"><h2>Text assistance</h2>
<label>Explicit text<textarea id="text"></textarea></label><div id="ai-actions" class="toolbar"></div>
<p class="muted small">This is a shared-capability client, not a privileged parser or another product's AI provider.</p></section>
<section class="card stack"><h2>Document result</h2><div id="result"></div></section><div id="more"></div></main>
<script src="shared/client.js"></script><script src="shared/ui.js"></script><script src="app.js"></script></body></html>
